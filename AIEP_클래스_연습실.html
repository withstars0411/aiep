/* Layout: practice screen (left, a light "app" device) + mission coach panel (right); stacks with the coach on top on phones */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --ink:#1E2738; --muted:#5A6377; --line:#D7DCE8;
  --accent:#3D5AF1; --accent-soft:#E4E9FF; --mark:#FF7A1A; --ok:#178A57; --ok-soft:#DDF4E8;
  --font:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141D; --surface:#1A2030; --ink:#E7EBF4; --muted:#A1AABE; --line:#2C3549;
  --accent:#8DA0FF; --accent-soft:#252F52; --mark:#FF9B52; --ok:#4CC38A; --ok-soft:#173828; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141D; --surface:#1A2030; --ink:#E7EBF4; --muted:#A1AABE; --line:#2C3549;
  --accent:#8DA0FF; --accent-soft:#252F52; --mark:#FF9B52; --ok:#4CC38A; --ok-soft:#173828; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{max-width:1360px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.top h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--muted)}
.wrap{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:960px){.wrap{grid-template-columns:minmax(0,1fr)}.coach{order:-1}}

/* ---------- coach panel ---------- */
.coach{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
@media (max-width:960px){.coach{position:static}}
.bubble-row{display:flex;gap:12px;align-items:flex-end}
.bubble-row img{width:76px;height:auto;flex:none}
.bubble{flex:1;min-width:0;background:var(--accent-soft);border-radius:16px 16px 16px 4px;padding:12px 14px}
.bubble .now{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.bubble h2{font-size:17px;font-weight:800;margin:2px 0 4px;line-height:1.35;text-wrap:balance}
.bubble p{margin:0;font-size:13.5px;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.chap{display:flex;flex-direction:column;gap:2px}
.chap h3{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:6px 0 4px}
.st{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:5px 8px;border-radius:8px;color:var(--muted)}
.st b{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.st.done{color:var(--ink)} .st.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.st.cur{background:var(--accent-soft);color:var(--ink);font-weight:700} .st.cur b{border-color:var(--accent);color:var(--accent)}
.steps{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
@media (max-width:960px){.steps{max-height:none}}
.ctrl{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.clock{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.clock strong{font-variant-numeric:tabular-nums}
.cbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:13.5px;font-weight:600}
.cbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .cbtn.pri{color:#10141D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cbtn.pri{color:#10141D}}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* ---------- practice device (always the light app look) ---------- */
.device{background:#FFFFFF;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(20,30,60,.10);min-width:0}
.chrome{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#F3F4F8;border-bottom:1px solid #E1E4EE;color:#5A6377}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#D5D9E4}
.addr{flex:1;min-width:0;background:#FFFFFF;border:1px solid #E1E4EE;border-radius:99px;padding:4px 12px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{--a-bg:#E4E6F6;--a-ink:#23283A;--a-mute:#6A7085;--a-line:#DDE0EA;--a-pri:#4651E6;--a-pri2:#E9EBFF;--a-card:#FFFFFF;
  position:relative;background:var(--a-bg);color:var(--a-ink);min-height:620px;font-size:14px;color-scheme:light}
.ahead{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#FFFFFF;border-bottom:1px solid var(--a-line);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:var(--a-ink);background:none;border:0;padding:0}
.logo span{font-size:11px;font-weight:700;background:#FFE7D4;color:#A9470A;border-radius:6px;padding:2px 6px}
.asearch{flex:1;min-width:120px;max-width:280px;border:1px solid var(--a-line);border-radius:10px;padding:7px 12px;color:var(--a-mute);font-size:13px;background:#FFFFFF}
.amenu{margin-left:auto;display:flex;gap:6px}
.amenu button{border:1px solid var(--a-line);background:#FFFFFF;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--a-ink)}
.abody{padding:22px}
.ah1{font-size:22px;font-weight:800;margin:0 0 16px}
.abtn{border:1px solid var(--a-line);background:#FFFFFF;color:var(--a-ink);border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
.abtn.pri{background:var(--a-pri);border-color:var(--a-pri);color:#FFFFFF}
.abtn.out{border-color:var(--a-pri);color:var(--a-pri)}
.abtn[aria-disabled="true"]{background:#ECEDF2;border-color:#ECEDF2;color:#9EA3B3}
.acard{background:var(--a-card);border-radius:18px;padding:20px}
.hint{outline:4px solid var(--mark)!important;outline-offset:3px;animation:pulse 1.4s ease-in-out infinite;position:relative;z-index:2}
@keyframes pulse{50%{outline-offset:7px;outline-color:rgba(255,122,26,.45)}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.bar i{transition:none}}

/* main */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
@media (max-width:760px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sec-h h2{font-size:18px;font-weight:800;margin:0}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ccard{background:#FFFFFF;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:170px;border:2px solid transparent;text-align:left}
button.ccard:hover{border-color:var(--a-pri)}
.ccard .nm{font-weight:800;font-size:16px;line-height:1.3}
.ccard .tag{align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--a-pri2);color:var(--a-pri)}
.ccard .tag.home{background:#DDF4E8;color:#146B45}
.ccard .mk{margin-top:auto;border:1px solid var(--a-line);border-radius:10px;padding:10px;font-weight:900;font-size:22px;color:#1F2FD0;text-align:center}
.ccard .mk i{color:#E5484D;font-style:normal}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:#FFFFFF;border-radius:20px;padding:16px}
@media (max-width:480px){.tools{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tool{border:1px solid var(--a-line);border-radius:12px;background:#FFFFFF;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--a-ink)}
.tool.ghost{visibility:hidden}
.cust{display:grid;place-items:center;border-radius:10px;background:#E9EBFF;color:#4651E6;font-weight:800}
.favs{display:flex;align-items:center;gap:6px;padding-left:12px;border-left:1px solid var(--a-line)}
.fav{border:0;background:none;padding:2px;display:grid;place-items:center;width:34px;height:34px}
.ttabs{display:flex;gap:6px;flex-wrap:wrap}
.ttabs button{border:0;border-radius:18px 18px 0 0;padding:12px 22px;background:#D6D9EE;color:var(--a-ink);font-weight:600}
.ttabs button.on{background:#FFFFFF;color:var(--a-pri);text-decoration:underline;text-underline-offset:4px}
.tpanel{background:#FFFFFF;border-radius:0 18px 18px 18px;padding:22px;display:flex;flex-direction:column;gap:26px}
.tsec h3{margin:0 0 8px;font-size:17px;padding-left:10px;border-left:3px solid var(--a-pri);line-height:1.2}
.tinfo{margin:0 0 14px;font-size:13px;color:#4A5065;line-height:1.7}
.tgrid{background:#EEEFF4;border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tcard{background:#FFFFFF;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:128px}
.tc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tc-nm{font-weight:600;font-size:14px}
.tc-ic{width:58px;height:46px;display:grid;place-items:center;flex:none}
.onoff{margin-top:auto;display:inline-flex;align-self:flex-start;border:1px solid var(--a-line);border-radius:99px;padding:3px}
.onoff button{border:0;background:none;border-radius:99px;padding:5px 14px;font-weight:600;font-size:13.5px;color:var(--a-ink)}
.onoff button.on{background:var(--a-pri);color:#FFFFFF}.onoff button.off{background:#6E7385;color:#FFFFFF}
.tcard.fv{cursor:pointer}.tcard.fv input{margin-top:auto;width:22px;height:22px;accent-color:var(--a-pri)}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;align-items:end}
.addform .field{margin:0}
.tool .ti{height:40px;display:grid;place-items:center}
.tool .ti img{display:block;width:auto;height:auto;object-fit:contain}
.toolwrap{display:flex;align-items:center;gap:6px;background:#FFFFFF;border-radius:20px;padding:12px 6px}
.toolwrap .tools{flex:1;min-width:0;padding:4px;border-radius:0;background:none}
.tarrow{border:0;background:none;font-size:26px;line-height:1;color:var(--a-ink);padding:4px 6px}
/* Google Classroom practice view */
.gc{background:#FFFFFF;color:#1F1F1F;min-height:620px;display:flex;flex-direction:column;position:relative}
.gchead{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #E3E3E3;min-height:58px}
.gchead .ham{font-size:20px;color:#444746}
.gchead .crumb{font-size:19px;display:flex;gap:10px;align-items:center;min-width:0;flex-wrap:wrap}
.gchead .crumb img{width:26px;height:auto}
.gchead .crumb a{color:#1F1F1F;text-decoration:none}
.gcmain{display:flex;flex:1;min-height:0}
.gcside{width:220px;flex:none;padding:12px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid #F0F0F0}
@media (max-width:760px){.gcside{display:none}}
.gcside button{border:0;background:none;text-align:left;padding:9px 14px;border-radius:0 99px 99px 0;font-size:14px;color:#1F1F1F;display:flex;gap:12px;align-items:center}
.gcside button.on{background:#C2E7FF;font-weight:600}
.gcside .lab{font-size:12.5px;color:#444746;padding:10px 14px 4px}
.gcside .bdg{width:24px;height:24px;border-radius:50%;background:#E8EAED;display:grid;place-items:center;font-size:12px;flex:none}
.gcbody{flex:1;min-width:0;display:flex;flex-direction:column}
.gctabs{display:flex;gap:4px;border-bottom:1px solid #E3E3E3;padding:0 18px;overflow-x:auto}
.gctabs button{border:0;background:none;padding:14px 14px 12px;font-size:14px;color:#444746;border-bottom:3px solid transparent;white-space:nowrap}
.gctabs button.on{color:#0B57D0;border-bottom-color:#0B57D0;font-weight:600}
.gcpage{padding:24px clamp(16px,6%,80px);display:flex;flex-direction:column;gap:22px}
.gcsec{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1F1F1F22;padding-bottom:10px}
.gcsec h2{margin:0;font-size:28px;font-weight:400;color:#1F1F1F}
.gcsec .ico{border:0;background:none;font-size:20px;color:#444746;padding:6px;border-radius:50%}
.gcperson{display:flex;align-items:center;gap:12px;padding:8px 4px;font-size:14px}
.gcperson .av{width:32px;height:32px;border-radius:50%;background:#1E5C3A;color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.gcperson .av.s{background:#8AB4F8;color:#0B2A55}
.gcperson .inv{margin-left:auto;font-size:12.5px;color:#5F6368}
.gcperson.pending{color:#80868B}
.gclink{border:0;background:none;color:#0B57D0;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;padding:6px 0;align-self:center}
.gcempty{color:#5F6368;font-size:14px;text-align:center;padding:16px 0}
.gccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:24px}
.gccard{border:1px solid #DADCE0;border-radius:10px;overflow:hidden;background:#FFFFFF;text-align:left;padding:0;display:flex;flex-direction:column;min-height:200px}
.gccard .ban{background:#1967D2;color:#FFFFFF;padding:16px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.gccard .ban b{font-size:20px;font-weight:500}
.gccard .ban span{font-size:13px;opacity:.9}
.gccard.g2 .ban{background:#137333}
.gccard .foot{margin-top:auto;padding:10px 16px;font-size:12.5px;color:#5F6368}
.gcdlg{background:#EDF2FA;border-radius:28px;padding:24px 22px 18px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;color:#1F1F1F;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gcdlg h3{margin:0;font-size:22px;font-weight:400}
.gcdlg .lnk{font-size:12.5px;color:#444746;word-break:break-all}
.gcdlg .lbl{font-size:13px;font-weight:600}
.gcdlg .sisrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #C4C7C5;padding-top:12px}
.sisbtn{position:relative;border:1px solid #747775;background:#FFFFFF;border-radius:99px;padding:8px 16px;color:#0B57D0;font-weight:600;font-size:13.5px}
.sisbtn .new{position:absolute;right:-8px;top:-11px;background:#C4EED0;color:#0D652D;border-radius:99px;font-size:10.5px;padding:1px 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid #C4C7C5;padding-top:12px;min-height:150px;align-content:flex-start}
.chip{display:flex;align-items:center;gap:6px;border:1px solid #747775;border-radius:99px;padding:3px 8px 3px 3px;font-size:12.5px;background:#FFFFFF}
.chip i{width:22px;height:22px;border-radius:50%;background:#8AB4F8;display:block}
.chips .ph{color:#747775;font-size:14px;width:100%}
.gcdlg .acts{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid #C4C7C5;padding-top:12px}
.gcdlg .acts button,.gctext{border:0;background:none;color:#0B57D0;font-weight:600;padding:8px 12px;border-radius:99px;font-size:14px}
.gcdlg .acts button[aria-disabled="true"]{color:#A8ABB0}

/* wizard */
.stepper{background:#FFFFFF;border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stp{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--a-mute);font-size:14px}
.stp b{width:28px;height:28px;border-radius:50%;background:#EEF0F5;display:grid;place-items:center;font-size:13px}
.stp.on{color:var(--a-ink)}.stp.on b{background:var(--a-pri);color:#FFFFFF}
.dotsep{color:var(--a-mute);letter-spacing:2px}
.notice{background:#F4F5F8;border-radius:12px;padding:16px 18px;color:#3C4256;line-height:1.7}
.notice em{font-style:normal;color:var(--a-pri);font-weight:700}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14.5px}
.chk input,.tbl input[type=checkbox]{width:20px;height:20px;accent-color:var(--a-pri)}
.navrow{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.method{background:#FFFFFF;border:2px solid transparent;border-radius:18px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--a-ink)}
.method.sel{border-color:var(--a-pri)}
.method h3{margin:0;font-size:17px}
.method p{margin:0;color:var(--a-mute);font-size:13.5px}
.method .rd{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.method .rd i{width:20px;height:20px;border-radius:50%;border:2px solid #C5C9D6}
.method.sel .rd i{border:6px solid var(--a-pri)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field label em{color:#E5484D;font-style:normal}
.field input,.field textarea{border:1px solid var(--a-line);border-radius:10px;padding:11px 12px;background:#FFFFFF;color:var(--a-ink);font:inherit;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:#2BB5C9;outline:2px solid #2BB5C9;outline-offset:0}
.cnt{align-self:flex-end;font-size:12.5px;color:var(--a-mute);font-variant-numeric:tabular-nums}
.filter{background:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter .info{width:100%;font-size:13px;color:var(--a-mute)}
.filter select,.filter .q{border:1px solid var(--a-line);border-radius:10px;padding:8px 10px;background:#FFFFFF;color:var(--a-ink);min-width:0}
.filter .q{flex:1;min-width:120px}
.tblwrap{overflow-x:auto;background:#FFFFFF;border-radius:16px;padding:6px 14px 14px}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0}
.tbar .cnt2{font-weight:700;margin-right:auto}
.tbar .cnt2 span{color:var(--a-pri)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.tbl th{background:#F4F6FB;font-weight:600;color:#4A5065;padding:10px 8px;text-align:center;border-top:1px solid #C9CEDB}
.tbl td{padding:10px 8px;text-align:center;border-bottom:1px solid #EEF0F5;font-variant-numeric:tabular-nums}
.tbl td.l{text-align:left}
.empty{padding:36px 0;text-align:center;color:var(--a-mute)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px}
.pill.ok{background:#DDF4E8;color:#146B45}.pill.no{background:#F1F2F6;color:#6A7085}
.sbtn{border:1px solid var(--a-pri);color:var(--a-pri);background:#FFFFFF;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600}
.sbtn[aria-disabled="true"]{border-color:#E1E3EA;color:#9EA3B3}
.pwdone{display:block;font-size:11.5px;color:#146B45;font-weight:700;margin-top:3px}

/* complete + manage */
.complete{background:#FFFFFF;border-radius:18px;padding:30px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.complete .ic{width:120px;height:120px;border-radius:50%;background:#DFF5F3;display:grid;place-items:center;font-size:44px;color:#1E9A8E;flex:none}
.complete h2{margin:0 0 8px;font-size:19px}
.complete p{margin:0;color:#4A5065;line-height:1.7}
.complete .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mhead{background:#FFFFFF;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mhead .av{width:38px;height:38px;border-radius:50%;background:var(--a-pri2);display:grid;place-items:center;color:var(--a-pri);font-weight:800}
.mhead h2{margin:0;font-size:19px;margin-right:auto}
.mhead .meta{font-size:13.5px;color:var(--a-mute)} .mhead .meta b{color:var(--a-ink)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:0;background:#FFFFFF;border-radius:99px;padding:10px 18px;font-weight:600;color:var(--a-ink)}
.tabs button.on{background:var(--a-pri);color:#FFFFFF}
.lmsnote{font-size:13px;color:#4A5065;line-height:1.6;margin-bottom:12px}
.lmsrow{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #EEF0F5;flex-wrap:wrap}
.lmsrow:last-child{border-bottom:0}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #C5C9D6;background:#FFFFFF;flex:none;padding:0}
.radio.on{border:7px solid var(--a-pri)}
.logo-box{width:62px;height:62px;border:1px solid var(--a-line);border-radius:12px;display:grid;place-items:center;flex:none;background:#FFFFFF}
.lmsrow .nm{font-weight:600;margin-right:auto}
.state{font-size:12.5px;font-weight:700}

/* modal + toast (inside the device) */
.scrim{position:absolute;inset:0;background:rgba(25,30,45,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:#FFFFFF;color:var(--a-ink);border-radius:18px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0;font-size:17px}
.modal p{margin:0;line-height:1.65;color:#3C4256}
.modal .mb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal .mb.one{grid-template-columns:1fr}
.modal .small{font-size:12.5px;color:var(--a-mute)}
.modal .err{color:#C2272D;font-size:13px;font-weight:600;min-height:1em}
.finish{text-align:center;align-items:center}
.finish img{width:180px;height:auto}
.finish ul{list-style:none;padding:0;margin:0;text-align:left;background:#F4F6FB;border-radius:12px;padding:12px 14px;width:100%;font-size:14px;line-height:1.8}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#23283A;color:#FFFFFF;border-radius:12px;padding:10px 16px;font-size:13.5px;z-index:30;max-width:90%;text-align:center}

/* role picker */
.roles{padding:30px 22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.roles h2{margin:0;font-size:22px;text-align:center}
.roles>p{margin:0;color:var(--a-mute);text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:760px}
.role{background:#FFFFFF;border:2px solid transparent;border-radius:20px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--a-ink)}
.role:hover{border-color:var(--a-pri)}
.role h3{margin:0;font-size:19px}
.role p{margin:0;color:#4A5065;font-size:14px;line-height:1.6}
.role ul{margin:0;padding-left:18px;font-size:13.5px;color:#4A5065;line-height:1.7}
.role .go{margin-top:auto;font-weight:700;color:var(--a-pri)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

 wcreate(){if(st.wiz.picked.size)mark('pick');st.modal={k:'c2',hint:'confirm2'}},
 c2ok(){cls().students=new Set(st.wiz.picked);st.modal=null;st.screen='done';mark('confirm2')},
 goassign(){st.screen='manage';st.tab='assign';st.sel.clear();st.af=null;mark('manage')},
 tab(e){st.tab=e.dataset.v;st.sel.clear();st.af=null;if(st.tab==='stu')mark('stuTab');if(st.tab==='lms'){mark('lmsTab');if(!cls().lms.saved)st.modal={k:'msg',t:'사용 설정 된 LMS가 없습니다.<br>LMS 연결 완료 후 사용하실 LMS 앞 라디오버튼(○)을 선택 후 [저장]을 눌러주세요.'}}},
 asearch(){const f=st.af;f.g=document.getElementById('fg').value;f.c=document.getElementById('fc').value;f.searched=true},
 asel(e){const id=+e.dataset.id;e.checked?st.sel.add(id):st.sel.delete(id)},
 aselall(e){const f=st.af,c=cls();POOL.filter(s=>(!f.g||s.g==f.g)&&(!f.c||s.c==f.c)&&!c.students.has(s.id)).forEach(s=>e.checked?st.sel.add(s.id):st.sel.delete(s.id))},
 abulk(){if(!st.sel.size)return toast('배정할 학생을 먼저 체크해 주세요.');st.modal={k:'abulk',hint:'assignMore'}},
 abulkok(){const c=cls();st.sel.forEach(id=>c.students.add(id));toast(`${st.sel.size}명을 배정했어요.`);st.sel.clear();st.modal=null;mark('assignMore')},
 aone(e){cls().students.add(+e.dataset.id);toast(`${byId(+e.dataset.id).name} 학생을 배정했어요.`);mark('assignMore')},
 msel(e){const id=+e.dataset.id;e.checked?st.sel.add(id):st.sel.delete(id)},
 mselall(e){[...cls().students].forEach(id=>e.checked?st.sel.add(id):st.sel.delete(id))},
 unassign(){if(!st.sel.size)return toast('배정을 해제할 학생을 먼저 체크해 주세요.');st.modal={k:'unassign'}},
 unassignok(){const c=cls();st.sel.forEach(id=>c.students.delete(id));toast('배정을 해제했어요.');st.sel.clear();st.modal=null},
 pwone(e){st.modal={k:'pw',ids:[+e.dataset.id],hint:'pwOne'}},
 pwbulk(){if(!st.sel.size)return toast('비밀번호를 바꿀 학생을 먼저 체크해 주세요.');st.modal={k:'pw',ids:[...st.sel],hint:'pwBulk'}},
 pwok(){const a=document.getElementById('pw1').value,b=document.getElementById('pw2').value,err=document.getElementById('pwerr');
  if(a.length<4){err.textContent='새 비밀번호를 4자 이상 입력해 주세요.';return 'stay'} if(a!==b){err.textContent='두 비밀번호가 같지 않아요.';return 'stay'}
  const ids=st.modal.ids;ids.forEach(id=>st.pw[id]=true);st.modal=null;st.sel.clear();toast(ids.length===1?`${byId(ids[0]).name} 학생의 비밀번호를 바꿨어요.`:`${ids.length}명의 비밀번호를 한 번에 바꿨어요.`);mark(ids.length===1?'pwOne':'pwBulk')},
 lconn(e){const c=cls(),k=e.dataset.v;if(c.lms[k])return;if(c.age<15)return toast(`클래스 생성 15분 뒤부터 연결할 수 있어요. (지금 ${c.age}분)`);st.modal={k:'conn',v:k,hint:k==='gc'?'connect':''}},
 connok(){const c=cls(),k=st.modal.v;c.lms[k]=true;st.modal=null;toast(`${k==='gc'?'구글 클래스룸':'웨일클래스'} 연결이 끝났어요. 이제 ○를 선택하고 [저장]하세요.`);if(k==='gc')mark('connect')},
 lsel(e){const c=cls(),k=e.dataset.v;if(!c.lms[k])return toast('먼저 [연결하기]를 해 주세요.');c.lms.sel=k},
 lsave(){const c=cls();if(!c.lms.sel)return toast('사용할 LMS 앞의 ○를 선택해 주세요.');c.lms.saved=c.lms.sel;st.modal={k:'msg',t:'저장되었습니다.'};if(c.lms.saved==='gc')mark('save')},
 skip(){const c=cls();if(c){c.age=15;toast('클래스를 만든 지 15분이 지났어요. 이제 [연결하기]가 켜져요.')}},
 mclose(){st.modal=null},
 tpage(e){const n=Math.max(1,Math.ceil(mainTools().length/12));st.tpage=((st.tpage||0)+(+e.dataset.v)+n)%n},
 toolset(){st.screen='tools';st.toolTab='set';st.favDraft=[...st.fav];mark('toolSet')},
 ttab(e){st.toolTab=e.dataset.v;st.favDraft=[...st.fav];if(st.toolTab==='fav')mark('favTab')},
 ton(e){const k=e.dataset.k,v=e.dataset.v==='1';st.on[k]=v;if(!v){st.fav=st.fav.filter(x=>x!==k);if(k!=='classroom')mark('toolOff')}toast(`${tName(k)} 사용을 ${v?'ON':'OFF'} 했어요. ${v?'메인 도구모음에 보여요.':'메인 도구모음에서 숨겨져요.'}`)},
 tadd(){const n=document.getElementById('tnm').value.trim(),u=document.getElementById('turl').value.trim(),f=document.getElementById('tico').files[0];
  if(!n)return toast('도구명을 입력해 주세요.');if(!u)return toast('URL을 입력해 주세요.');
  const add=icon=>{st.custom.push({k:'cu'+Date.now(),name:n,url:u,icon});toast(`${n}을(를) 등록했어요. 메인 도구모음 맨 뒤에 보여요.`)};
  if(f){const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f);return 'stay'}add(null)},
 tdel(e){st.custom=st.custom.filter(c=>c.k!==e.dataset.k);st.fav=st.fav.filter(x=>x!==e.dataset.k)},
 fpick(e){const k=e.dataset.k;if(e.checked){if(st.favDraft.length>=3){e.checked=false;return toast('즐겨찾는 수업도구는 최대 3개까지 선택 가능합니다.')}st.favDraft.push(k)}else st.favDraft=st.favDraft.filter(x=>x!==k)},
 fsave(){st.fav=[...st.favDraft];st.modal={k:'msg',t:st.fav.length?`저장되었습니다.<br>메인 화면 로고 오른쪽에 ${st.fav.map(tName).join(', ')} 아이콘이 보여요.`:'저장되었습니다.'};if(st.fav.length)mark('favPick')},
 gcopen(){st.screen='gc';st.gc={cls:null,tab:'stream',dlg:false,chips:[],loading:false};mark('openGC')},
 gchome(){if(st.gc){st.gc.cls=null;st.gc.dlg=false}},
 gcclass(e){const c=gcLinked().find(x=>String(x.id)===e.dataset.id);st.gc.cls=c.id;st.gc.tab='stream';st.gc.dlg=false;mark('gcClass')},
 gctab(e){st.gc.tab=e.dataset.v;if(st.gc.tab==='people')mark('gcPeople')},
 gcinv(){st.gc.dlg=true;st.gc.chips=[];mark('gcInvite')},
 gcclose(){st.gc.dlg=false},
 gcsis(){const g=st.gc,c=st.classes.find(x=>x.id===g.cls);g.loading=true;render();mark('gcSIS');
  setTimeout(()=>{g.loading=false;g.chips=[...c.students].filter(id=>!c.gcInvited.has(id));if(!g.chips.length)toast(c.students.size?'AIEP 클래스 학생이 이미 모두 초대되어 있어요.':'AIEP 클래스에 배정된 학생이 없어요. 먼저 학생을 배정해 주세요.');render()},700);return 'stay'},
 gcchipx(e){st.gc.chips=st.gc.chips.filter(id=>id!==+e.dataset.id)},
 gcsend(){const g=st.gc,c=st.classes.find(x=>x.id===g.cls);if(!g.chips.length)return;g.chips.forEach(id=>c.gcInvited.add(id));toast(`학생 ${g.chips.length}명에게 초대를 보냈어요. 수락하면 수업에 들어와요.`);g.chips=[];g.dlg=false;mark('gcSend')},
 reset(){st=fresh()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const fn=A[t.dataset.act];if(!fn)return;
 if(t.tagName==='INPUT'&&t.type==='checkbox'){fn(t);render();return}
 if(t.getAttribute('aria-disabled')==='true'&&t.dataset.act!=='lconn')return;
 if(fn(t)!=='stay'&&t.dataset.act!=='noop')render()});
document.addEventListener('change',e=>{if(e.target.id==='hints'){hints=e.target.checked;render()}
 if(st.screen==='wiz'&&(e.target.id==='fg'||e.target.id==='fc')){st.wiz[e.target.id==='fg'?'g':'c']=e.target.value}
 if(st.screen==='manage'&&st.af&&(e.target.id==='fg'||e.target.id==='fc')){st.af[e.target.id==='fg'?'g':'c']=e.target.value}});
document.addEventListener('input',e=>{if(!st.wiz)return;if(e.target.id==='cname'){st.wiz.name=e.target.value;document.getElementById('cnt1').textContent=`(${e.target.value.length}/30자)`}
 if(e.target.id==='cintro'){st.wiz.intro=e.target.value;document.getElementById('cnt2').textContent=`(${e.target.value.length}/200자)`}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.modal&&st.modal.k!=='finish'){st.modal=null;render()}});
st=fresh();render();
</script>
